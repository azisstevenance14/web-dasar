<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
</head>
<body>
    <!-- Belajar Menampilkan gambar dengan menggunakan tag <img> -->
     <h1>Belajar Menampilkan Gambar</h1>

     <!-- untuk menampilkan sebuah gambar kita butuh sebuah attribute src artinya source -->

     <!-- Menampilkan Gambar -->
     <!-- alt (Alternative Text)= menampilkan keterangan gambar apabila gambarnya tidak tampil -->
     <!-- src = menampilkan gambar pada directory atau folder yang menyimpan file gambar itu -->
     <img src="img/download.jpg" alt="gambar saya">
</body>
</html>
