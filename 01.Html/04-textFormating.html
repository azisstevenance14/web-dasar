<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formating</title>
</head>
<body>
    <h1>Belajar Text Formating</h1>

    <!-- Strong biasanya Menampilkan teks dalam bentuk Tebal -->
     <p>
        Saya Sedang Belajar
        <strong>HTML</strong>
     </p>

     <!-- <b> Biasanya digunakan untuk membuat teks tebal -->
        <p>Ini adalah teks
            <b>Tebal</b>
        </p>

        <!-- <em> Biasanya digunakan untuk menampilkan teks dalam bentuk miring -->
            <p>
                Saya Sedang
                <em>belajar HTML</em>
            </p>

        <!-- <i> digunakan untuk berfokus untuk membuat tulisan miring -->
            <p>
                Ini adalah teks
                <i>Miring</i>
            </p>

        <!-- <mark> digunakan untuk menandai atau menyorot sebuah teks, biasanya di tampilkan seperti di stabilo -->
            <p>
                Materi yang saya pelajari adalah 
                <mark>HTML</mark>
            </p>

        <!-- <del> digunakan untuk menunjukan teks yang dianggap sudah dihapus atau tidak berlaku, biasanya memberikan coret pada teks -->
            <p>
                Harga Lama :
                <del>Rp. 100.000</del>
            </p>

        <!-- <ins> digunakan untuk menunjukan teks yang ditambahkan, biasanya memberikan garis bawah pada teks -->
            <p>
                Harga Baru :
                <ins>Rp. 80.000</ins>
            </p>

        <!-- <small> digunakan untuk membuat teks berukuran lebih kecil -->
            <p>
                <small>Ini adalah keterangan tambahan</small>
            </p>

        <!-- <sub> adalah singkatan dari subscript, digunakan untuk membuat teks berada sedikit lebih rendah -->
            <p>
                Rumus Air adalah H<sub>2</sub>O
            </p>

        <!-- <sup> adalah singkatan dari supscript, digunakan untuk membuat teks sedikit lebih tinggi -->
            <p>
                Contoh pangkat adalah 2<sup>2</sup> = 4.
            </p>

        
</body>
</html>
