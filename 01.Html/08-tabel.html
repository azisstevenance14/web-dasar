<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tabel</title>
</head>
<body>
    <!-- tabel digunakan untuk menampilkan data dalam bentuk baris dan kolom  -->
    <!-- untuk membuat tabel kita akan mengenal beberapa tag :
        <table> = wadah tabel
        <tr> (table Row)= baris tabel
        <th> (table Header)= header/judul kolom
        <td> Table Data = data/isi tabel    
    -->
    
    <h1>Tabel Sederhana</h1>
    <table >
        <tr>
            <th>Nama</th>
            <th>Umur</th>
            <th>Kota</th>
        </tr>

        <tr>
            <td>Azis Steven S. Ance</td>
            <td>29</td>
            <td>Gorontalo</td>
        </tr>
        <tr>
            <td>Cindy Pradita E. Bau</td>
            <td>28</td>
            <td>Gorontalo</td>
        </tr>
    </table>

    <!-- Tabel dengan Border -->
    <h2>Tabel dengan Border</h2>
       <table border="2">
        <tr>
            <th>Nama Barang</th>
            <th>Stock</th>
            <th>Harga</th>
        </tr>

        <tr>
            <td>Jagung</td>
            <td>12 Ton</td>
            <td>6650</td>
        </tr>
    </table>
</body>
</html>
