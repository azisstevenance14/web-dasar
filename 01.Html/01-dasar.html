<!-- memberi tahu browser bahwa dokumen ini menggunakan HTML5 -->
<!DOCTYPE html>

<!-- tag pembuka utama html, Lang ="en" menunjukan bahasa utama halaman ini -->
<html lang="en">

<!-- Head berisi informasi tentang halaman. Informasi di dalam head umunya tidak tampil sebagai isi utama halaman -->
<head>

    <!-- Menetukan karakter yang digunakan oleh halaman. UTF-8 mwndukung banyak karakter, termasuk : huruf, angka simbol, dan berbagai bahasa -->
    <meta charset="UTF-8">

    <!-- Membuta tampilan halaman menyesuaikan ukuran layar perangkat seperti komputer, tablet, dan smartphone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- menetukan judul halaman, judul ini terlihta pada tab browser -->
    <title>Document</title>
</head>

<!-- body berisi isi halaman yang akan di tampilkan  -->
<body>

    <!-- h1 digunakan untuk menetukan judul utama halaman -->
    <h1>Belajar HTML Dasar</h1>

    <!-- digunakan untuk membuat paragraph -->
    <p>Saya sedang belajar HTML dasar</p>
    
</body>


<!-- penutup html menandakan bahwa seluruh HTML telah selesai -->
</html>
