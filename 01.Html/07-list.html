<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- ul(Unordered List) = daftar yang tidak memiliki angka urutan angka -->
    <h1>Unordered List</h1>

    <p>
        Contoh daftar buah : 
    </p>

    <ul>
        <!-- li (List Item) = satu item atau satu bagian dari sebuah daftar -->
        <li>Apel</li>
        <li>Mangga</li>
        <li>Jeruk</li>
        <li>Stroberry</li>
    </ul>


    <!-- ol (Ordered List) = daftar yang memiliki urutan angka -->
     <h2>Oredered List</h2>
     <p>
        Contoh langkah belajar :
     </p>
    
    <ol>
        <li>Belajar Javascript</li>
        <li>Belajar HTML</li>
        <li>Belajar CSS</li>
    </ol>
</body>
</html>
