<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Width & Height</title>
</head>
<body>

    <h2>01. Width</h2>
    <div class="width-box">
        Saya Memiliki width 300px.
    </div>

    <h2>02. Height</h2>
    <div class="height-box">
        Saya Memiliki hegiht 150px.
    </div>

    <h2>03. Max Width</h2>
    <div class="max-width-box">
        Lebar saya memiliki batas maksimal 500px.
    </div>

    <h2>04. Min Width</h2>
    <div class="min-width-box">
        Lebar saya minimal 300px.
    </div>

    <h2>05. Max Height</h2>
    <div class="max-height-box">
        Tinggi saya memiliki batas maksimal 200px.
    </div>
</body>
</html>
