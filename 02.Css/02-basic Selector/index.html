<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Basic Selector</title>
</head>
<body>

    <!-- 
        basic selector :
        1. element
        2. class
        3. id selector

        ID "judul-utama" di berikan kepada element <h2>.

        CSS nantinya dapat memilih elemen terbeut menggunakan :

        #judul-utama
    
    -->

    <p id="paragraf-utama">
        ini adalah paragraf utama yang mempunyai ID sendiri.
    </p>

    <h4 class="nama-class">Ini adalah selector class</h4>

    <h3 id="nama-id">Ini adalah selector ID </h3>
    
</body>
</html>
