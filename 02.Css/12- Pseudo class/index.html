<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pseudo Class</title>
</head>
<body>
    <h1>Pseudo Class</h1>

    <h2>Pseudo Hover</h2>
    <button class="tombol">
        arahkan Mouse kesini
    </button>

    <h2>Pseudo Focus</h2>
    <input type="text" placeholder="klik input kesini" class="input-nama">

    <h2>Pseudo Active</h2>
    <button class="tombol-active">Tekan dan Tahan</button>

    <h2>Pseudo First Child</h2>
    <div class="daftar">
        <p>Item Pertama</p>
        <p>Item Kedua</p>
        <p>Item Ketiga</p>
    </div>

    <h2>Pseudo Last Child</h2>
    <div class="daftar-terakhir">
        <p>Item Pertama</p>
        <p>Item Kedua</p>
        <p>Item Ketiga</p>
    </div>

    <h2>Pseudo nth-child</h2>
    <div class="daftar-urutan">
        <p>Item 1</p>
        <p>Item 2</p>
        <p>Item 3</p>
        <p>Item 4</p>
    </div>
</body>
</html>
