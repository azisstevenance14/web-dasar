<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flex-box</title>
</head>
<body>
    <h1>Belajar FlexBox</h1>

    <h2>Flex Display</h2>
    <div class="flex-container">
        <div class="flex-item">
            Kotak 1
        </div>
        <div class="flex-item">
            Kotak 2
        </div>
        <div class="flex-item">
            Kotak 3
        </div>
    </div>

    <h2>Flex Direction</h2>
    <div class="direction-container">
        <div class="direction-item">
            A
        </div>
        <div class="direction-item">
            B
        </div>
        <div class="direction-item">
            C
        </div>
    </div>

    <h2>Justify Content</h2>
    <div class="justify-container">
        <div class="justify-item">
            1
        </div>
        <div class="justify-item">
            2
        </div>
        <div class="justify-item">
            3
        </div>
    </div>

    <h2>Align Item</h2>
    <div class="align-container">
        <div class="align-item">
            A
        </div>
        <div class="align-item">
            B
        </div>
        <div class="align-item">
            C
        </div>
    </div>

    <h2>GAP</h2>
    <div class="gap-container">
        <div class="gap-item">
            Kotak 1
        </div>
        <div class="gap-item">
            Kotak 2
        </div>
        <div class="gap-item">
            Kotak 3
        </div>
    </div>

    <h2>Flex WRAP</h2>
    <div class="wrap-container">
        <div class="wrap-item">
            1
        </div>
        <div class="wrap-item">
            2
        </div>
        <div class="wrap-item">
            3
        </div>

    </div>
</body>
</html>
