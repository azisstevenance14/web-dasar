<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS GRID</title>
</head>
<body>
    <h1>Belajar CSS GRID</h1>
    <h2>Display Grid</h2>    
    <div class="grid-container">
        <div class="grid-item">
            1
        </div>
        <div class="grid-item">
            2
        </div>
        <div class="grid-item">
            3
        </div>
        <div class="grid-item">
            4
        </div>

    </div>

    <h2>Grid Template Columns</h2>    
    <div class="column-container">
        <div class="column-item">
            A
        </div>
        <div class="column-item">
            B
        </div>
        <div class="column-item">
            C
        </div>
        <div class="column-item">
            D
        </div>
    </div>

    <h2>Grid Template Rows</h2>    
    <div class="row-container">
        <div class="row-item">
            1
        </div>
        <div class="row-item">
           2
        </div>
        <div class="row-item">
            3
        </div>
        <div class="row-item">
            4
        </div>
    </div>

    <h2>GAP</h2>    
    <div class="gap-grid">
        <div class="gap-item">
            kotak 1
        </div>
        <div class="gap-item">
           kotak 2
        </div>
        <div class="gap-item">
           kotak 3
        </div>
        <div class="gap-item">
           Kotak 4
        </div>
    </div>

    <h2>Grid Column</h2>    
    <div class="column-span-container">
        <div class="column-span-item">
            kotak yang melebar
        </div>
        <div class="column-normal-item">
           kotak biasa
        </div>
        <div class="column-normal-item">
           kotak biasa
        </div>
    </div>

    <h2>Grid Row</h2>    
    <div class="row-span-container">
        <div class="row-span-item">
            kotak yang memanjang kebawah
        </div>
        <div class="row-normal-item">
           kotak biasa
        </div>
        <div class="row-normal-item">
           kotak biasa
        </div>
    </div>



    
</body>
</html>
