<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Belajar Display</title>
</head>
<body>
    <h1>1. Display Block</h1>
    <div class="block-box">
        Saya adalah display block
    </div>

    <h1>2. Display Inline</h1>
    <span class="inline-box">
        Inline 1
    </span>
    <span class="inline-box">
        Inline 2
    </span>
    <span class="inline-box">
        Inline 3
    </span>

    <h1>3. Display Inline Block</h1>
    <div class="inline-block-box">
        Kotak 1
    </div>
    <div class="inline-block-box">
        Kotak 2
    </div>
    <div class="inline-block-box">
        Kotak 3
    </div>

    <h1>4. Display None</h1>
    <div class="none-box">
        Saya disembunyikan oleh css
    </div> 

    <p>
        Kalau kamu tidak melihat kotak diatas,<br> 
        berarti display : none Berhasil
    </p>  
</body>
</html>
